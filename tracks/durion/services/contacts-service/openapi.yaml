openapi: 3.0.3
info:
  title: Contacts Service API
  version: "1.0.0"
  description: >
    Owns the Person/Contact aggregate (REQ-2). Contract-first source for
    `contacts-service` — see companies-service/openapi.yaml's description
    for the ADR-0004 regeneration/drift-check note; the same applies here.

    Status-code classification follows ADR-0002; error bodies follow
    ADR-0003. Cross-service relationships are opaque IDs only (ADR-0001) —
    `companyId` is never a foreign key, just an ID that happens to identify
    a Company in companies-service.

    Delete semantics: REQ-2 doesn't carry REQ-1's explicit
    "document the cascade choice" clause, but this service still applies
    ADR-0001/ADR-0005's generic soft-delete-and-announce pattern rather than
    a hard delete. Reason: ADR-0001's own "Applying this here" section
    already commits opportunities-service to maintaining an
    `ext_contacts_person` read-only replica fed by `contact.events.v1` — a
    hard delete here would leave that replica silently stale with no event
    to correct it. This does NOT add a `personInactive` flag anywhere
    (nothing in REQ-3/4/5 asks for one) — it only keeps the replica
    mechanism ADR-0001 already established internally consistent. Flagged
    to the person for visibility; not a scope change to any requirement.

servers:
  - url: /api/contacts
    description: Routed through the gateway (INFRA-4).

security:
  - bearerAuth: []

tags:
  - name: contacts

paths:
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts
      parameters:
        - name: companyId
          in: query
          description: Filter to contacts linked to this company.
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Case-insensitive match against first/last name or email.
          schema: { type: string }
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: A page of contacts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreateRequest' }
      responses:
        '201':
          description: Contact created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /contacts/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact by ID
      responses:
        '200':
          description: The contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Partially update a contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdateRequest' }
      responses:
        '200':
          description: Updated contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deactivateContact
      tags: [contacts]
      summary: Deactivate (soft-delete) a contact
      description: >
        Soft-delete + `contact.deactivated` event on `contact.events.v1`,
        mirroring companies-service. See this file's top-level description
        for why this applies to Contact even though REQ-2 doesn't require it
        explicitly.
      responses:
        '204':
          description: Contact deactivated.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The contact is already deactivated (lifecycle-status collision, ADR-0002).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /contacts/{contactId}/reactivate:
    parameters:
      - name: contactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reactivateContact
      tags: [contacts]
      summary: Reactivate a previously deactivated contact
      responses:
        '200':
          description: Reactivated contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The contact is already active (lifecycle-status collision, ADR-0002).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Single shared token per REQ-13.

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  schemas:
    Contact:
      type: object
      required: [id, firstName, lastName, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        firstName: { type: string, minLength: 1, maxLength: 255 }
        lastName: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        companyId:
          type: string
          format: uuid
          nullable: true
          description: Opaque reference to a Company in companies-service. Null means unassigned (REQ-2).
        active: { type: boolean, readOnly: true }
        deactivatedAt: { type: string, format: date-time, nullable: true, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    ContactCreateRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 255 }
        lastName: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        companyId: { type: string, format: uuid, nullable: true }

    ContactUpdateRequest:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 255 }
        lastName: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        companyId: { type: string, format: uuid, nullable: true }

    ContactPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    Error:
      type: object
      required: [status, code, message]
      properties:
        status: { type: integer }
        code:
          type: string
          description: "e.g. CONTACT_NOT_FOUND, CONTACT_ALREADY_INACTIVE, VALIDATION_FAILED."
        message: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    BadRequest:
      description: Request-shape validation failure (ADR-0002).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authorization failure (ADR-0002).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No contact exists with that ID (plain resource-lookup miss, not an ADR-0002 domain refusal).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Domain-policy refusal that isn't an identity/version/lifecycle collision (ADR-0002).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
