server:
  port: 8081

spring:
  application:
    name: companies-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:companies_db}
    username: ${DB_USERNAME:companies_service}
    password: ${DB_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate:
      # No entities yet (INFRA-1). Schema management strategy (Flyway vs.
      # Hibernate auto-ddl) is a decision for when REQ-1 introduces the
      # Company entity, not this scaffolding issue.
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
