server:
  port: 8081

spring:
  application:
    name: companies-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:companies_db}
    username: ${DB_USERNAME:companies_service}
    password: ${DB_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway (db/migration) owns the schema; Hibernate only checks the
      # entity mappings match it at startup, never generates DDL itself.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
