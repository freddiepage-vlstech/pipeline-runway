openapi: 3.0.3
info:
  title: Companies Service API
  version: "1.0.0"
  description: >
    Owns the Company aggregate (REQ-1). This is the source contract for
    `companies-service` — per ADR-0004, implementation is written to satisfy
    this contract, and once code exists, CI regenerates this file from
    annotated source and fails the build on drift. Hand-authored for now
    because no implementation exists yet (contract-first, AGENTS.md "Build
    order").

    Status-code classification follows ADR-0002; every 4xx/5xx body is a
    typed Error per ADR-0003. Delete semantics (soft-delete + lifecycle
    event, never hard-delete) follow ADR-0005. Cross-service relationships
    are opaque IDs only, per ADR-0001 — this service never references
    contacts-service or opportunities-service data.

servers:
  - url: /api/companies
    description: Routed through the gateway (INFRA-4).

security:
  - bearerAuth: []

tags:
  - name: companies

paths:
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies
      parameters:
        - name: search
          in: query
          description: Case-insensitive match against name or domain.
          schema: { type: string }
        - name: includeInactive
          in: query
          description: Include deactivated (soft-deleted) companies. Default false.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: A page of companies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyCreateRequest' }
      responses:
        '201':
          description: Company created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /companies/{companyId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company by ID
      responses:
        '200':
          description: The company.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Partially update a company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyUpdateRequest' }
      responses:
        '200':
          description: Updated company.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deactivateCompany
      tags: [companies]
      summary: Deactivate (soft-delete) a company
      description: >
        Satisfies REQ-1's "delete" acceptance criterion via ADR-0005's
        announce-and-flag pattern: sets a deactivation timestamp (the row is
        never removed) and publishes `company.deactivated` on
        `company.events.v1`. There is no hard-delete endpoint — ADR-0005
        rejects hard-deleting an aggregate other services hold references to.
      responses:
        '204':
          description: Company deactivated.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The company is already deactivated (lifecycle-status collision, ADR-0002).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /companies/{companyId}/reactivate:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reactivateCompany
      tags: [companies]
      summary: Reactivate a previously deactivated company
      description: >
        Symmetric counterpart to deactivation per ADR-0005: clears the
        deactivation timestamp and publishes `company.reactivated` on
        `company.events.v1`.
      responses:
        '200':
          description: Reactivated company.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The company is already active (lifecycle-status collision, ADR-0002).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Single shared token per REQ-13. Not a per-user auth model.

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  schemas:
    Company:
      type: object
      required: [id, name, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 255 }
        domain:
          type: string
          nullable: true
          description: Website/domain, e.g. "acme.com".
        active:
          type: boolean
          readOnly: true
          description: False once deactivated. Never hard-deleted, per ADR-0005.
        deactivatedAt: { type: string, format: date-time, nullable: true, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    CompanyCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        domain: { type: string, nullable: true }

    CompanyUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        domain: { type: string, nullable: true }

    CompanyPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Company' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    Error:
      type: object
      required: [status, code, message]
      description: >
        Every domain exception carries its own status per ADR-0003; this is
        that status surfaced on the wire, plus a stable machine-readable
        code for clients (e.g. the generated SDK, REQ-14's test suite).
      properties:
        status: { type: integer, description: "HTTP status, matches the response code." }
        code:
          type: string
          description: "e.g. COMPANY_NOT_FOUND, COMPANY_ALREADY_INACTIVE, VALIDATION_FAILED."
        message: { type: string }
        fieldErrors:
          type: array
          description: Present only for 400 request-shape validation failures.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    BadRequest:
      description: Request-shape validation failure (ADR-0002 — never a domain-policy refusal).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authorization failure (ADR-0002).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >
        No company exists with that ID. Plain resource-lookup miss — ADR-0002's
        classification test covers domain refusals, not existence lookups, so
        this uses standard REST semantics rather than the 403/409/422 test.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Domain-policy refusal that isn't an identity/version/lifecycle collision (ADR-0002).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
